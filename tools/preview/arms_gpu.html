<!doctype html><html><body style="margin:0;background:#666">
<script type="module">
// GPU arm-pose bench: same as arms.html but rendered through the engine's
// instanced skinning shader (LBS / DQS) with the real skin materials.
// ?dqs=0..1 ?view=... ?cases=... ?zoom=...
import * as THREE from "three";
import { WebGPURenderer } from "three/webgpu";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
import { HDRLoader } from "three/addons/loaders/HDRLoader.js";
import { createSharedSkinnedRig } from "/src/engine/SharedSkinnedMesh.ts";
import { HalfSword } from "/src/runtime/half_sword.ts";
import { evaluateDrivenJoints } from "/src/runtime/driven_joints.ts";
import { applyArmPivots } from "/src/runtime/arm_pivots.ts";
import { writeDualQuat } from "/src/runtime/actor.ts";
import { createSword } from "/src/render/sword.ts";
import { createHumanMaterialFactory } from "/src/render/skin.ts";

const q = new URLSearchParams(location.search);
const CASES = {
  guardMid:   [[0.12, 0.0, 0.4], "two"],
  guardLow:   [[0.1, -0.4, 0.35], "two"],
  chamberHi:  [[0.1, 0.5, 0.1], "two"],
  chamberR:   [[0.45, 0.45, 0.15], "two"],
  chamberL:   [[-0.25, 0.45, 0.2], "two"],
  cutEndL:    [[-0.25, -0.35, 0.6], "two"],
  cutEndR:    [[0.45, -0.3, 0.55], "two"],
  flatR:      [[0.5, 0.1, 0.12], "two"],
  riseLowR:   [[0.4, -0.55, 0.25], "two"],
  oneHandHi:  [[0.4, 0.45, 0.3], "one"],
  oneHandX:   [[-0.28, 0.1, 0.5], "one"],
  oneHandLow: [[0.3, -0.5, 0.45], "one"],
  thrust:     [[0.06, 0.0, 0.4], "thrust"],
  halfSword:  [[0.05, -0.1, 0.35], "half"],
  relaxed:    [[0.2, -0.42, 0.28], "relaxed"],
};
const names = (q.get("cases") ?? Object.keys(CASES).join(",")).split(",");
const renderer = new WebGPURenderer({ antialias: true });
await renderer.init();
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5a5a60);
const env = await new HDRLoader().loadAsync("/assets/env/potsdamer_platz_1k.hdr");
env.mapping = THREE.EquirectangularReflectionMapping; scene.environment = env; scene.environmentIntensity = 0.5;
const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(2, 4, 5); scene.add(d);

const gltf = await new GLTFLoader().loadAsync("/assets/human.glb");
const parts = []; gltf.scene.traverse((o) => { if (o.isSkinnedMesh) parts.push(o); });
const template = new THREE.SkinnedMesh(mergeGeometries(parts.map((p) => p.geometry), true), parts.map((p) => p.material));
parts[0].parent.add(template); parts.forEach((p) => p.removeFromParent());
template.bind(parts[0].skeleton, parts[0].bindMatrix);
gltf.scene.updateMatrixWorld(true);
const { factory } = await createHumanMaterialFactory("/textures/human/");
const rig = createSharedSkinnedRig(template, names.length, ["Hips"], undefined, {
  materialFactory: factory, dqs: +(q.get("dqs") ?? 0),
  drivenJoints: [
    { kind: "twist", output: "LeftArmEnd", parent: "LeftForeArm", driver: "LeftHand", weight: 0.8 },
    { kind: "twist", output: "RightArmEnd", parent: "RightForeArm", driver: "RightHand", weight: 0.8 },
    { kind: "follow", output: "Neck1", driver: "Head", weight: 0.5 },
  ],
});
scene.add(rig.mesh);
rig.mesh.count = names.length;
const SPACING = 1.3;
const bind = rig.boneInverses.map((m) => m.clone().invert());
names.forEach((name, n) => {
  const [off, mode] = CASES[name];
  const shift = new THREE.Matrix4().makeTranslation((n - (names.length - 1) / 2) * SPACING, 0, 0);
  const hs = new HalfSword(rig);
  hs.enabled = true; hs.halfGrip = mode === "half";
  let world;
  for (let f = 0; f < 90; f++) {
    world = bind.map((m) => shift.clone().multiply(m));
    hs.apply(world);
    const held = mode !== "relaxed";
    hs.handOffset(hs.mainSide).set(...off);
    hs.update(1 / 60, { dx: 0, dy: 0, wheel: 0, leftHeld: held && mode !== "one", rightHeld: held, thrust: mode === "thrust" });
    hs.handOffset(hs.mainSide).set(...off);
  }
  world = bind.map((m) => shift.clone().multiply(m));
  hs.apply(world);
  applyArmPivots(world, rig.armPivots, rig.boneInverses);
  if (q.get("driven") !== "0") evaluateDrivenJoints(world, rig.drivenJoints);
  if (q.get("debug")) {
    const I = (n) => rig.boneNameToIndex.get(n);
    const rq = (i) => { const p = new THREE.Vector3(), r = new THREE.Quaternion(), s2 = new THREE.Vector3(); world[i].decompose(p, r, s2); return r; };
    for (const side of ["Left", "Right"]) {
      const rel = rq(I(side + "ForeArm")).invert().multiply(rq(I(side + "Hand")));
      const bRel = new THREE.Quaternion().setFromRotationMatrix(rig.boneInverses[I(side + "ForeArm")].clone().multiply(rig.boneInverses[I(side + "Hand")].clone().invert()));
      const delta = rel.clone().multiply(bRel.clone().invert());
      const helper = rq(I(side + "ForeArm")).invert().multiply(rq(I(side + "ArmEnd")));
      console.log(name, side, "hand-vs-forearm delta angle", (2 * Math.acos(Math.min(1, Math.abs(delta.w)))).toFixed(2), "helper angle", (2 * Math.acos(Math.min(1, Math.abs(helper.w)))).toFixed(2));
    }
  }
  const off16 = new THREE.Matrix4();
  for (let k = 0; k < world.length; k++) {
    off16.multiplyMatrices(world[k], rig.boneInverses[k]);
    off16.toArray(rig.boneMatricesArray, n * rig.agentStride + k * 16);
    if (rig.boneDQArray) writeDualQuat(off16, rig.boneDQArray, (n * rig.totalBones + k) * 8);
  }
  if (hs.swordVisible) {
    const s = createSword(); s.visible = true;
    s.position.copy(hs.swordPosition); s.quaternion.copy(hs.swordQuaternion); scene.add(s);
  }
});
rig.boneMatricesAttr.needsUpdate = true;
if (rig.boneDQAttr) rig.boneDQAttr.needsUpdate = true;

const views = { front: [0, 0.15, 1], side: [1, 0.15, 0.1], sideR: [-1, 0.15, 0.1], back: [0, 0.2, -1], frontR: [0.6, 0.2, 1], frontL: [-0.6, 0.2, 1] };
const view = views[q.get("view") ?? "front"];
const zoom = +(q.get("zoom") ?? 1);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
const center = new THREE.Vector3(0, names.length === 1 ? 1.3 : 1.15, 0);
const dist = Math.max(names.length * SPACING * 1.1, 2.6) * 1.7 / zoom;
cam.position.copy(center).add(new THREE.Vector3(...view).normalize().multiplyScalar(dist));
cam.lookAt(center);
await renderer.renderAsync(scene, cam);
await renderer.renderAsync(scene, cam);
document.title = "ready";
</script></body></html>
