<!doctype html><html><body style="margin:0;background:#666">
<script type="module">
// Deterministic arm-pose test bench: runs the real HalfSword arm IK + grip +
// driven joints on the human in bind pose, for a grid of hand targets.
// ?view=front|side|back|top  ?cases=<name,...>  ?frames=N
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { HalfSword } from "/src/runtime/half_sword.ts";
import { compileDrivenJoints, evaluateDrivenJoints } from "/src/runtime/driven_joints.ts";
import { createSword } from "/src/render/sword.ts";
import { compileArmPivots, applyArmPivots } from "/src/runtime/arm_pivots.ts";

const q = new URLSearchParams(location.search);
// name: [x, y, z] main-hand offset (x right, y up from chest, z forward), mode
const CASES = {
  guardMid:   [[0.12, 0.0, 0.4], "two"],
  guardLow:   [[0.1, -0.4, 0.35], "two"],
  chamberHi:  [[0.1, 0.5, 0.1], "two"],
  chamberR:   [[0.45, 0.45, 0.15], "two"],
  chamberL:   [[-0.25, 0.45, 0.2], "two"],
  cutEndL:    [[-0.25, -0.35, 0.6], "two"],
  cutEndR:    [[0.45, -0.3, 0.55], "two"],
  flatR:      [[0.5, 0.1, 0.12], "two"],
  riseLowR:   [[0.4, -0.55, 0.25], "two"],
  oneHandHi:  [[0.4, 0.45, 0.3], "one"],
  oneHandX:   [[-0.28, 0.1, 0.5], "one"],
  oneHandLow: [[0.3, -0.5, 0.45], "one"],
  thrust:     [[0.06, 0.0, 0.4], "thrust"],
  halfSword:  [[0.05, -0.1, 0.35], "half"],
  relaxed:    [[0.2, -0.42, 0.28], "relaxed"],
};
const names = (q.get("cases") ?? Object.keys(CASES).join(",")).split(",");
const cols = Math.ceil(Math.sqrt(names.length));
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight); renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x6a6a70);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(2, 4, 5); scene.add(d);

const gltf = await new GLTFLoader().loadAsync("/assets/human.glb");
const SPACING = 1.5;
const views = { front: [0, 0.18, 1], side: [1, 0.18, 0.15], back: [0, 0.2, -1], top: [0.3, 3, 0.8], frontR: [0.6, 0.2, 1], frontL: [-0.6, 0.2, 1] };
const view = views[q.get("view") ?? "front"];

names.forEach((name, n) => {
  const [off, mode] = CASES[name];
  const root = SkeletonUtils.clone(gltf.scene);
  const col = n % cols, row = Math.floor(n / cols);
  root.position.set((col - (cols - 1) / 2) * SPACING, 0, -row * SPACING * 1.4);
  scene.add(root);
  root.updateMatrixWorld(true);
  let skinned = null;
  root.traverse((o) => { if (o.isSkinnedMesh && !skinned) skinned = o; });
  const sk = skinned.skeleton;
  const bones = sk.bones;
  const nameToIdx = new Map(bones.map((b, i) => [b.name, i]));
  // Bind world (relative to this clone's root), local, and a BFS cascade.
  const rootInv = root.matrixWorld.clone().invert();
  const bindWorld = bones.map((b) => rootInv.clone().multiply(b.matrixWorld));
  const cascade = [];
  const queue = bones.filter((b) => !bones.includes(b.parent));
  while (queue.length) {
    const b = queue.shift();
    for (const c of b.children) if (bones.includes(c)) { cascade.push({ skelIdx: bones.indexOf(c), parentSkelIdx: bones.indexOf(b) }); queue.push(c); }
  }
  const usePivots = q.get("pivots") !== "0";
  const armPivots = usePivots ? compileArmPivots(
    new Map(bones.filter((b) => Array.isArray(b.userData.meshPivot)).map((b) => [b.name, new THREE.Vector3().fromArray(b.userData.meshPivot)])),
    nameToIdx, sk.boneInverses, bones.map((b) => bones.indexOf(b.parent)),
  ) : [];
  const rig = {
    boneNameToIndex: nameToIdx,
    boneInverses: sk.boneInverses,
    bindLocalMatrices: bones.map((b) => b.matrix.clone()),
    untrackedCascade: cascade,
    armPivots,
  };
  const hs = new HalfSword(rig);
  hs.enabled = true;
  hs.halfGrip = mode === "half";
  const drivenSpecs = [
    { kind: "twist", output: "LeftArmEnd", parent: "LeftForeArm", driver: "LeftHand", weight: 0.8 },
    { kind: "twist", output: "RightArmEnd", parent: "RightForeArm", driver: "RightHand", weight: 0.8 },
    { kind: "follow", output: "Neck1", driver: "Head", weight: 0.5 },
  ];
  const driven = compileDrivenJoints(drivenSpecs, nameToIdx, sk.boneInverses);
  let world = bindWorld.map((m) => m.clone());
  const frames = +(q.get("frames") ?? 90);
  for (let f = 0; f < frames; f++) {
    world = bindWorld.map((m) => m.clone());
    hs.apply(world);
    const held = mode !== "relaxed";
    hs.handOffset(hs.mainSide).set(...off);
    hs.update(1 / 60, { dx: 0, dy: 0, wheel: 0, leftHeld: held && mode !== "one", rightHeld: held, thrust: mode === "thrust" });
    hs.handOffset(hs.mainSide).set(...off);
  }
  world = bindWorld.map((m) => m.clone());
  const rows = [];
  if (q.get("debug")) globalThis.__armDebug = (o) => rows.push(o);
  hs.apply(world);
  globalThis.__armDebug = undefined;
  if (rows.length) {
    for (const side of ["Left", "Right"]) {
      const r = rows.filter((x) => x.side === side);
      if (!r.length) continue;
      const bestR = r.reduce((a, b) => (b.cost < a.cost ? b : a));
      const zero = r.find((x) => x.swivel === 0 && x.roll === 0);
      console.log(side, "best", JSON.stringify(bestR), "zero", JSON.stringify(zero));
    }
  }
  applyArmPivots(world, armPivots, sk.boneInverses);
  evaluateDrivenJoints(world, driven);
  // Write back as local transforms (world is relative to the clone root).
  const boneWorld = world.map((m) => root.matrixWorld.clone().multiply(m));
  for (let i = 0; i < bones.length; i++) {
    const b = bones[i];
    const parentW = bones.includes(b.parent) ? boneWorld[bones.indexOf(b.parent)] : b.parent.matrixWorld;
    const local = parentW.clone().invert().multiply(boneWorld[i]);
    local.decompose(b.position, b.quaternion, b.scale);
    b.updateMatrixWorld(true);
  }
  if (q.get("bones")) {
    const helper = new THREE.SkeletonHelper(root);
    helper.material.depthTest = false; helper.material.transparent = true;
    scene.add(helper);
    const dot = (p, color) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.012), new THREE.MeshBasicMaterial({ color, depthTest: false })); m.position.copy(p); m.renderOrder = 9; scene.add(m); };
    for (const n of ["RightArm", "RightForeArm", "RightHand", "LeftArm", "LeftForeArm", "LeftHand"]) dot(new THREE.Vector3().setFromMatrixPosition(boneWorld[nameToIdx.get(n)]), n.includes("Fore") ? 0x00ff00 : n.includes("Hand") ? 0x0088ff : 0xff0000);
    for (const a of armPivots) dot(a.pivot.clone().applyMatrix4(a.clavicle >= 0 ? boneWorld[a.clavicle].clone().multiply(sk.boneInverses[a.clavicle]) : new THREE.Matrix4()), 0xffff00);
    console.log(name, ["RightArm","RightForeArm","RightHand"].map(n => new THREE.Vector3().setFromMatrixPosition(boneWorld[nameToIdx.get(n)]).toArray().map(v=>v.toFixed(3)).join(",")).join(" | "));
  }
  if (hs.swordVisible) {
    const s = createSword(); s.visible = true;
    s.position.copy(hs.swordPosition).applyMatrix4(root.matrixWorld);
    s.quaternion.copy(hs.swordQuaternion);
    scene.add(s);
  }
  // Label.
  const c = document.createElement("canvas"); c.width = 256; c.height = 48;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.font = "bold 28px monospace"; g.fillText(name, 4, 34);
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c) }));
  label.scale.set(0.8, 0.15, 1); label.position.set(root.position.x, 2.05, root.position.z); scene.add(label);
});

const rows = Math.ceil(names.length / cols);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
const dist = Math.max(cols * SPACING * 1.25, rows * 2.4) * 1.55;
const center = new THREE.Vector3(0, 1.15, -(rows - 1) * SPACING * 0.7);
const zoom = +(q.get("zoom") ?? 1);
if (names.length === 1) center.y = 1.3;
cam.position.copy(center).add(new THREE.Vector3(...view).normalize().multiplyScalar(dist / zoom));
cam.lookAt(center);
renderer.render(scene, cam);
document.title = "ready";
</script></body></html>
